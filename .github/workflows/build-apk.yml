name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle assembleDebug
      - name: Prepare APK
        run: mkdir -p dist && cp app/build/outputs/apk/debug/app-debug.apk dist/LimbusFPSUnlocker.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LimbusFPSUnlocker
          path: dist/LimbusFPSUnlocker.apk
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: LimbusFPSUnlocker
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Limbus FPS Unlocker ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/LimbusFPSUnlocker.apk
