name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LimbusFPSUnlocker.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LimbusFPSUnlocker
          path: dist/LimbusFPSUnlocker.apk
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: LimbusFPSUnlocker
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Limbus FPS Unlocker {0}', github.ref_name) || format('Limbus FPS Unlocker Build #{0}', github.run_number) }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/LimbusFPSUnlocker.apk
